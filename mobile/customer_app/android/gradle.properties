org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows Defender locks Kotlin's incremental cache .tab files, which makes
# "Could not close incremental caches" fail the build. Disabling the Kotlin
# incremental compilation is the safe workaround; the build is slightly
# slower but succeeds reliably.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Gradle JVM proxy settings. The proxy reaches storage.googleapis.com fine
# (which mirrors download.flutter.io), so we only exempt local hosts.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=3066
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=3066
systemProp.http.nonProxyHosts=localhost|127.0.0.1
