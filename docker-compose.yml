version: '3.9'

services:
  app:
    build: .
    container_name: boya-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      - db
      - redis
    networks:
      - boya-network

  db:
    image: postgres:16-alpine
    container_name: boya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: ${SQL_DB_NAME}
    volumes:
      - boya-db-data:/var/lib/postgresql/data
    networks:
      - boya-network

  redis:
    image: redis:7-alpine
    container_name: boya-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - boya-redis-data:/data
    networks:
      - boya-network

volumes:
  boya-db-data:
  boya-redis-data:

networks:
  boya-network:
    driver: bridge
